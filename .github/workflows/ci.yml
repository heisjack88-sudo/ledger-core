name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      # Integration tests run on PGlite (Postgres in WASM): no Docker,
      # no services, no DATABASE_URL needed in CI.
      - name: Test
        run: npm test

      - name: Build
        run: npm run build
